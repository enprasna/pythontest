<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมบวกเลขสามตัว</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="calculator">
        <h1>โปรแกรมบวกเลขสามตัว</h1>
        <p>กรอกตัวเลขที่ต้องการคำนวณ</p>

        <form id="addition-form">
            <label for="first-number">ตัวเลขที่ 1</label>
            <input id="first-number" name="first-number" type="number" step="any" required>

            <label for="second-number">ตัวเลขที่ 2</label>
            <input id="second-number" name="second-number" type="number" step="any" required>

            <label for="third-number">ตัวเลขที่ 3</label>
            <input id="third-number" name="third-number" type="number" step="any" required>

            <button type="submit">คำนวณผลรวม</button>
        </form>

        <p id="result" class="result" aria-live="polite">ผลรวมจะแสดงที่นี่</p>
    </main>
    <script src="app.js"></script>
</body>
</html>
